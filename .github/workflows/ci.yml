name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Enforce formatting on new/changed Dart files without blocking on legacy debt.
      - name: Check changed Dart formatting
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No base commit available; validating all Dart sources"
            dart format --output=none --set-exit-if-changed lib test
            exit 0
          fi
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$GITHUB_SHA" -- 'lib/**/*.dart' 'test/**/*.dart' 'lib/*.dart' 'test/*.dart')
          if (( ${#files[@]} == 0 )); then
            echo "No changed Dart files"
            exit 0
          fi
          dart format --output=none --set-exit-if-changed "${files[@]}"
      - run: flutter analyze
      - run: flutter test
