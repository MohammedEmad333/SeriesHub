name: serieshub
description: Arabic-first TV series discovery and viewing app.
publish_to: "none"
version: 0.17.0+17

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.9.2
  screen_brightness: ^2.1.11
  volume_controller: ^3.4.4
  youtube_player_iframe: ^6.0.2
  shared_preferences: ^2.5.3
  http: ^1.2.2
  serieshub_providers:
    git:
      url: https://github.com/MohammedEmad333/SeriesHub-Providers.git
      ref: 0f8effc8b6af285498e3442ffac8c76406f21637

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.jpg"
  min_sdk_android: 21
